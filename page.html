<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sorting Algorithms Visualizer</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="formatting.css">
    </head>
    <body>
        <header>
            <h1>Sorting Algorithms Visualizer</h1>
        </header>
        <main>
            <div id="options-sidebar">
                <button id="generate-button">Generate Array</button>
                <input type="number" id="array-size" min="5" max="100" value="20">
                <button id="reset-button">Reset</button>
                <p>Array Size: <span id="array-size-value">20</span></p>
                <button id="selection-sort">Selection Sort</button>
                <button id="insertion-sort">Insertion Sort</button>
                <button id="bubble-sort">Bubble Sort</button>
            </div>
            <div id="speed-slider-container">
                <label for="speed-slider">Speed:</label>
                <input type="range" id="speed-slider" min="0" max="1950" value="1000">
            </div>
            <div id="display-container">
            </div>
        </main>
        <footer>
            <p>* due to bugs in the animation, insertion sort is currently technically gnome sort. this is temporary.</p>
        </footer>
        <script type="module" src="main.js"></script>
    </body>
</html>
